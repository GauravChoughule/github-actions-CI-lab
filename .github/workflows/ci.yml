name: CI
run-name: CI on ${{ github.ref_name }} (${{ github.event_name }}) by @${{ github.actor }}

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"            # README-only changes don't need a test run
  pull_request:
    branches: [main]       # check every PR before it can be merged
  workflow_dispatch:       # adds a "Run workflow" button in the Actions tab

# If you push again while a run is still going, cancel the old run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow can only read the repo
permissions:
  contents: read

jobs:
  # ---------- Job 1: code style and obvious bugs ----------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                 # reuse downloaded packages between runs

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ruff
        run: ruff check . --output-format=github   # shows errors inline on the PR

  # ---------- Job 2: tests on several Python versions ----------
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint                      # only runs if lint passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false               # let every version finish, even if one fails
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with coverage
        run: >
          pytest -v
          --junitxml=pytest-report.xml
          --cov=src --cov-report=term-missing --cov-report=xml
          --cov-fail-under=90

      - name: Run unittest
        if: success() || failure()   # run even if pytest failed, to see both results
        run: python -m unittest discover -s test -p "test_unittest.py" -v

      - name: Write coverage to job summary
        if: always()
        run: |
          echo "### Coverage – Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            pytest-report.xml
            coverage.xml
          retention-days: 7
